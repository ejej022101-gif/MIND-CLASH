<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mind Clash - Strand Battle</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="navbar">

        <div class="logo">
            🧠 MIND CLASH
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>



    <!-- =========================
         BATTLE PAGE
    ========================== -->

    <main class="battle-page">


        <!-- BATTLE HEADER -->

        <section class="battle-header">

            <p class="battle-label">
                STRAND BATTLE
            </p>

            <h1>
                Prove Your Knowledge
            </h1>

            <p id="playerInfo">
                Loading player...
            </p>

        </section>



        <!-- =========================
             BATTLE CARD
        ========================== -->

        <section class="battle-card">


            <!-- PROGRESS -->

            <div class="battle-top">

                <span id="questionNumber">
                    Question 1 / 10
                </span>

                <span id="scoreDisplay">
                    Score: 0
                </span>

            </div>



            <!-- QUESTION -->

            <div class="question-area">

                <h2 id="questionText">
                    Loading question...
                </h2>

            </div>



            <!-- ANSWERS -->

            <div id="answerContainer"
                 class="answer-container">

            </div>



            <!-- NEXT BUTTON -->

            <button id="nextButton"
                    class="next-btn"
                    onclick="nextQuestion()"
                    style="display:none;">

                NEXT QUESTION

            </button>


        </section>



        <!-- =========================
             RESULT
        ========================== -->

        <section id="resultScreen"
                 class="result-screen"
                 style="display:none;">

            <div class="result-card">

                <div class="result-icon">
                    🏆
                </div>

                <h2 id="resultTitle">
                    Battle Complete
                </h2>

                <p id="resultMessage">
                    Your results are ready.
                </p>

                <div class="result-stats">

                    <p>
                        Score:
                        <strong id="finalScore">
                            0
                        </strong>
                    </p>

                    <p>
                        Points:
                        <strong id="pointsEarned">
                            0
                        </strong>
                    </p>

                </div>


                <button onclick="location.reload()"
                        class="battle-btn">

                    PLAY AGAIN

                </button>


                <button onclick="window.location.href='index.html'"
                        class="secondary-btn">

                    BACK TO MIND CLASH

                </button>

            </div>

        </section>

    </main>



    <!-- =========================
         BATTLE SCRIPT
    ========================== -->

    <script>

        // =====================================
        // PLAYER
        // =====================================

        let player =
            JSON.parse(
                localStorage.getItem(
                    "mindClashPlayer"
                )
            ) || {

                name: "",
                strand: "",
                points: 0,
                wins: 0,
                losses: 0,
                allStrandUnlocked: false

            };



        // =====================================
        // CHECK PLAYER
        // =====================================

        if (
            !player.name ||
            !player.strand
        ) {

            alert(
                "Please set up your player first."
            );

            window.location.href =
                "index.html";

        }



        // =====================================
        // QUESTIONS
        // =====================================

        const questions = [

            {
                question:
                    "Which term refers to the ability to understand and use information effectively?",

                answers: [
                    "Knowledge",
                    "Literacy",
                    "Communication",
                    "Memory"
                ],

                correct: 1
            },


            {
                question:
                    "What is the main purpose of communication?",

                answers: [
                    "To create confusion",
                    "To exchange meaning",
                    "To avoid interaction",
                    "To hide information"
                ],

                correct: 1
            },


            {
                question:
                    "Which is an example of verbal communication?",

                answers: [
                    "Facial expression",
                    "Hand gesture",
                    "Spoken words",
                    "Eye contact"
                ],

                correct: 2
            },


            {
                question:
                    "Which skill involves examining information carefully before accepting it?",

                answers: [
                    "Critical thinking",
                    "Guessing",
                    "Memorizing",
                    "Ignoring"
                ],

                correct: 0
            },


            {
                question:
                    "What do we call information that is supported by evidence?",

                answers: [
                    "Opinion",
                    "Fact",
                    "Rumor",
                    "Assumption"
                ],

                correct: 1
            },


            {
                question:
                    "Which communication element refers to the person who sends the message?",

                answers: [
                    "Receiver",
                    "Channel",
                    "Sender",
                    "Feedback"
                ],

                correct: 2
            },


            {
                question:
                    "What is feedback in communication?",

                answers: [
                    "The response to a message",
                    "The physical location",
                    "The original message",
                    "The communication barrier"
                ],

                correct: 0
            },


            {
                question:
                    "Which of the following can be a communication barrier?",

                answers: [
                    "Clear language",
                    "Active listening",
                    "Noise",
                    "Feedback"
                ],

                correct: 2
            },


            {
                question:
                    "What does teamwork require most?",

                answers: [
                    "Cooperation",
                    "Isolation",
                    "Competition only",
                    "Silence"
                ],

                correct: 0
            },


            {
                question:
                    "Which action demonstrates active listening?",

                answers: [
                    "Interrupting constantly",
                    "Ignoring the speaker",
                    "Paying attention and responding appropriately",
                    "Changing the topic"
                ],

                correct: 2
            }

        ];



        // =====================================
        // GAME VARIABLES
        // =====================================

        let currentQuestion = 0;

        let score = 0;

        let answered = false;



        // =====================================
        // PLAYER INFO
        // =====================================

        document.getElementById(
            "playerInfo"
        ).textContent =

            player.name +
            " • " +
            player.strand +
            " • " +
            player.points +
            " Points";



        // =====================================
        // LOAD QUESTION
        // =====================================

        function loadQuestion() {

            answered = false;

            const question =
                questions[currentQuestion];


            document.getElementById(
                "questionNumber"
            ).textContent =

                "Question " +
                (currentQuestion + 1) +
                " / " +
                questions.length;


            document.getElementById(
                "scoreDisplay"
            ).textContent =

                "Score: " +
                score;


            document.getElementById(
                "questionText"
            ).textContent =
                question.question;



            const container =
                document.getElementById(
                    "answerContainer"
                );


            container.innerHTML = "";



            question.answers.forEach(
                (answer, index) => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "answer-btn";


                    button.textContent =
                        answer;


                    button.onclick = () =>
                        selectAnswer(
                            index,
                            button
                        );


                    container.appendChild(
                        button
                    );

                }
            );



            document.getElementById(
                "nextButton"
            ).style.display =
                "none";

        }



        // =====================================
        // SELECT ANSWER
        // =====================================

        function selectAnswer(
            selectedIndex,
            selectedButton
        ) {

            if (answered) {
                return;
            }


            answered = true;


            const question =
                questions[currentQuestion];


            const buttons =
                document.querySelectorAll(
                    ".answer-btn"
                );


            buttons.forEach(
                button => {

                    button.disabled = true;

                }
            );



            if (
                selectedIndex ===
                question.correct
            ) {

                score++;

                selectedButton.classList.add(
                    "correct"
                );

            } else {

                selectedButton.classList.add(
                    "wrong"
                );


                buttons[
                    question.correct
                ].classList.add(
                    "correct"
                );

            }



            document.getElementById(
                "scoreDisplay"
            ).textContent =

                "Score: " +
                score;


            document.getElementById(
                "nextButton"
            ).style.display =
                "block";

        }



        // =====================================
        // NEXT QUESTION
        // =====================================

        function nextQuestion() {

            currentQuestion++;


            if (
                currentQuestion >=
                questions.length
            ) {

                finishBattle();

                return;

            }


            loadQuestion();

        }



        // =====================================
        // FINISH BATTLE
        // =====================================

        function finishBattle() {

            const battleWon =
                score >= 6;


            let earnedPoints = 0;


            if (battleWon) {

                earnedPoints = 10;

                player.points += 10;

                player.wins++;

            } else {

                player.losses++;

            }



            if (
                player.points >= 100
            ) {

                player.allStrandUnlocked =
                    true;

            }



            localStorage.setItem(
                "mindClashPlayer",
                JSON.stringify(player)
            );



            document.querySelector(
                ".battle-card"
            ).style.display =
                "none";


            document.querySelector(
                ".battle-header"
            ).style.display =
                "none";


            document.getElementById(
                "resultScreen"
            ).style.display =
                "flex";



            document.getElementById(
                "finalScore"
            ).textContent =

                score +
                " / " +
                questions.length;



            document.getElementById(
                "pointsEarned"
            ).textContent =

                "+" +
                earnedPoints;



            if (battleWon) {

                document.getElementById(
                    "resultTitle"
                ).textContent =
                    "YOU WON!";


                document.getElementById(
                    "resultMessage"
                ).textContent =

                    "Great job! You earned 10 points.";

            } else {

                document.getElementById(
                    "resultTitle"
                ).textContent =
                    "BATTLE LOST";


                document.getElementById(
                    "resultMessage"
                ).textContent =

                    "You need at least 6 correct answers to win.";

            }

        }



        // =====================================
        // START
        // =====================================

        loadQuestion();

    </script>

</body>

</html>
